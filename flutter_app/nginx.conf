server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serwuj CSS, JS, obrazki z cache (produkcja) — Flutter Web dodaje hash do nazw plików.
    location ~* \.(?:css|js|map|png|jpg|jpeg|svg|woff2?|ttf|otf|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Wszystkie route'y z GoRouter kierujemy na index.html — SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
