server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No-cache na całość — czysto, bez przechwytywania regex-em (które psuło
    # alias dla /static/). Statyka w tym projekcie jest mała, brak cache to OK.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        alias /usr/share/nginx/html/;
    }
}
