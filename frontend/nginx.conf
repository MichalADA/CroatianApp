server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        alias /usr/share/nginx/html/;
    }

    # JS/CSS/HTML — bez cache, żeby user dostawał świeże pliki po deployu.
    # Obrazki/audio/fonty zostają z domyślnym cache.
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
